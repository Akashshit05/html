<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TL Ke Bolo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-a: #163832;
      --bg-b: #2d4263;
      --bg-c: #f6b73c;
      --ink: #fbfbff;
      --muted: rgba(251, 251, 255, 0.74);
      --panel: rgba(12, 18, 31, 0.58);
      --panel-strong: rgba(12, 18, 31, 0.74);
      --line: rgba(255, 255, 255, 0.18);
      --accent: #ffdf6b;
      --accent-2: #41ead4;
      --danger: #ff6b8a;
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 14%, rgba(255, 223, 107, 0.28), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(65, 234, 212, 0.25), transparent 26%),
        linear-gradient(135deg, var(--bg-a), var(--bg-b) 56%, var(--bg-c));
      transition: background 500ms ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 88%);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 32px 18px;
    }

    .reaction-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: min(720px, 100%);
      padding: clamp(24px, 5vw, 52px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, var(--panel), rgba(255, 255, 255, 0.1));
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(22px);
      animation: panelIn 520ms cubic-bezier(0.2, 0.9, 0.2, 1);
    }

    .panel::after {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      right: -70px;
      bottom: -100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.13);
      pointer-events: none;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(0, 0, 0, 0.18);
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0;
    }

    h1 {
      margin-top: 18px;
      font-size: clamp(3rem, 14vw, 7rem);
      line-height: 0.9;
      letter-spacing: 0;
      text-wrap: balance;
      text-shadow: 0 12px 28px rgba(0, 0, 0, 0.26);
    }

    .subtitle {
      width: min(560px, 100%);
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.18rem);
      line-height: 1.65;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 16px;
      color: #081018;
      background: var(--accent);
      font-weight: 900;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.24);
      transform: translateY(0);
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .btn:hover {
      transform: translateY(-3px) rotate(-1deg);
      box-shadow: 0 20px 46px rgba(0, 0, 0, 0.28);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn.secondary {
      color: var(--ink);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }

    .input-wrap {
      width: min(520px, 100%);
      margin: 30px auto 0;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 800;
    }

    .text-input {
      width: 100%;
      min-height: 58px;
      padding: 0 18px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 18px;
      outline: 0;
      color: var(--ink);
      background: rgba(0, 0, 0, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .text-input::placeholder {
      color: rgba(251, 251, 255, 0.48);
    }

    .text-input:focus {
      border-color: var(--accent-2);
      background: rgba(0, 0, 0, 0.32);
      box-shadow: 0 0 0 4px rgba(65, 234, 212, 0.14);
    }

    .helper-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      color: rgba(251, 251, 255, 0.68);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .result-card {
      width: min(560px, 100%);
      margin: 30px auto 0;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel-strong);
      text-align: left;
    }

    .result-label {
      color: var(--accent-2);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .said-text {
      margin-top: 10px;
      overflow-wrap: anywhere;
      color: var(--muted);
      line-height: 1.5;
    }

    .joke {
      margin-top: 18px;
      color: var(--ink);
      font-size: clamp(1.35rem, 4vw, 2.25rem);
      font-weight: 950;
      line-height: 1.2;
      text-wrap: balance;
    }

    .mood {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 9px 12px;
      border-radius: 999px;
      color: #10131a;
      background: var(--accent-2);
      font-size: 0.9rem;
      font-weight: 900;
    }

    .floaty,
    .confetti {
      position: absolute;
      pointer-events: none;
      user-select: none;
      will-change: transform, opacity;
    }

    .floaty {
      bottom: -56px;
      font-size: var(--size);
      animation: floatUp var(--speed) linear forwards;
    }

    .confetti {
      left: var(--x);
      top: var(--y);
      width: 10px;
      height: 16px;
      border-radius: 3px;
      background: var(--color);
      animation: pop 900ms ease-out forwards;
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) rotate(0deg);
      }
      12% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), -110vh, 0) rotate(var(--spin));
      }
    }

    @keyframes pop {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot));
      }
    }

    @media (max-width: 520px) {
      .app-shell {
        align-items: stretch;
        padding: 18px 12px;
      }

      .panel {
        display: grid;
        align-content: center;
        min-height: calc(100vh - 36px);
        padding: 24px 16px;
        border-radius: 22px;
      }

      .action-row {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .helper-row {
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell" aria-live="polite">
    <div class="reaction-layer" id="reactionLayer" aria-hidden="true"></div>
    <section class="panel" id="app"></section>
  </main>

  <script>
    const app = document.getElementById("app");
    const reactionLayer = document.getElementById("reactionLayer");
    const maxChars = 96;

    const jokes = [
      "TL bolega: eta bug na, eta feature er emotional damage.",
      "Tu legend hai... bas tera WiFi aur motivation dono slow hai.",
      "Dard valid hai, lekin standup me bolna mat, ticket ban jayega.",
      "TL already typing: kal morning tak ho jayega na?",
      "Tera code chal gaya? Screenshot bhej, warna kahani lag rahi hai.",
      "Eta solve hobe... pehle chai, then try.",
      "Error 404: tera confidence staging server pe reh gaya.",
      "Tu developer hai ya surprise generator? Production bhi confuse hai.",
      "TL mood: hasi bhi aa rahi, sprint bhi yaad aa raha.",
      "Bug chhota tha, tu usko Netflix series bana diya.",
      "Aaj ka truth: console.log bhi tujhe judge kar raha hai.",
      "Tension mat le, TL bolega: nice try, now fix it.",
      "Tera plan solid hai, execute karte hi plot twist aa jata hai.",
      "Life set hoti, agar requirements daily mutate na hoti.",
      "Crush offline, server online, priority clear rakho."
    ];

    const moods = [
      "TL Mood: Chill Debugger",
      "TL Mood: Sprint Samurai",
      "TL Mood: Chai Powered",
      "TL Mood: Merge Master",
      "TL Mood: Deadline DJ",
      "TL Mood: Silent Reviewer"
    ];

    const themes = [
      ["#163832", "#2d4263", "#f6b73c"],
      ["#14213d", "#00b4d8", "#fca311"],
      ["#2f184b", "#1b998b", "#fffd82"],
      ["#0b132b", "#5bc0be", "#f25f5c"],
      ["#2b2d42", "#8d99ae", "#ef233c"],
      ["#073b4c", "#118ab2", "#ffd166"]
    ];

    const floatEmojis = ["😂", "🔥", "😎", "😭", "🤌", "✨", "💀", "🚀"];
    let floatTimer;
    let lastJokeIndex = -1;

    function createElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) {
        element.className = className;
      }
      if (text) {
        element.textContent = text;
      }
      return element;
    }

    function clearApp() {
      app.replaceChildren();
    }

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function getRandomJoke() {
      let index = Math.floor(Math.random() * jokes.length);
      if (jokes.length > 1 && index === lastJokeIndex) {
        index = (index + 1) % jokes.length;
      }
      lastJokeIndex = index;
      return jokes[index];
    }

    function shuffleTheme() {
      const [a, b, c] = randomItem(themes);
      document.documentElement.style.setProperty("--bg-a", a);
      document.documentElement.style.setProperty("--bg-b", b);
      document.documentElement.style.setProperty("--bg-c", c);
    }

    function renderIntro() {
      clearApp();
      app.append(
        createElement("div", "kicker", "TL helpdesk open ache"),
        createElement("h1", "", "TL কে বলো"),
        createElement("p", "subtitle", "Apna dard drop karo. TL judge bhi karega, solve bhi karega, aur thoda roast free me milega.")
      );

      const actions = createElement("div", "action-row");
      const boloButton = createElement("button", "btn", "BOLO");
      const moodButton = createElement("button", "btn secondary", "Random Mood");

      boloButton.type = "button";
      moodButton.type = "button";
      boloButton.setAttribute("aria-label", "Start and tell TL your problem");
      moodButton.setAttribute("aria-label", "Change page mood");

      boloButton.addEventListener("click", () => {
        burstConfetti();
        renderInput();
      });

      moodButton.addEventListener("click", () => {
        shuffleTheme();
        spawnFloaty();
      });

      actions.append(boloButton, moodButton);
      app.append(actions);
    }

    function renderInput() {
      clearApp();
      app.append(
        createElement("div", "kicker", "Bol bhai, TL sun raha hai"),
        createElement("h1", "", "Dard Likho"),
        createElement("p", "subtitle", "One line me batao kya scene hai. Extra drama allowed hai, lekin 96 characters ke andar.")
      );

      const form = createElement("form", "input-wrap");
      const label = createElement("label", "", "Apna dard");
      label.setAttribute("for", "userInput");

      const input = createElement("input", "text-input");
      input.id = "userInput";
      input.type = "text";
      input.maxLength = maxChars;
      input.placeholder = "Example: deploy karte hi sab toot gaya";
      input.autocomplete = "off";

      const helper = createElement("div", "helper-row");
      const hint = createElement("span", "", "Empty bhi chalega, TL mind-read kar lega.");
      const counter = createElement("span", "", `0/${maxChars}`);
      helper.append(hint, counter);

      const actions = createElement("div", "action-row");
      const submitButton = createElement("button", "btn", "Submit");
      const backButton = createElement("button", "btn secondary", "Back");
      submitButton.type = "submit";
      backButton.type = "button";
      actions.append(submitButton, backButton);

      input.addEventListener("input", () => {
        const count = input.value.length;
        counter.textContent = `${count}/${maxChars}`;
        hint.textContent = count > 70 ? "Bas bas, novel nahi Jira ticket banana hai." : "Empty bhi chalega, TL mind-read kar lega.";
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        renderResult(input.value);
      });

      backButton.addEventListener("click", renderIntro);

      form.append(label, input, helper, actions);
      app.append(form);
      input.focus();
    }

    function renderResult(rawInput) {
      const said = rawInput.trim() || "kuch nahi bola";
      const joke = getRandomJoke();
      const mood = randomItem(moods);

      shuffleTheme();
      clearApp();
      app.append(
        createElement("div", "kicker", "TL verdict ready"),
        createElement("h1", "", "Result"),
        createElement("p", "subtitle", "Diagnosis complete. Report thoda funny hai, but emotionally accurate.")
      );

      const card = createElement("div", "result-card");
      card.append(
        createElement("div", "result-label", "Tum bola"),
        createElement("p", "said-text", `"${said}"`),
        createElement("p", "joke", joke),
        createElement("div", "mood", mood)
      );

      const actions = createElement("div", "action-row");
      const retryButton = createElement("button", "btn", "Try Again");
      const introButton = createElement("button", "btn secondary", "Home");
      retryButton.type = "button";
      introButton.type = "button";
      retryButton.addEventListener("click", renderInput);
      introButton.addEventListener("click", renderIntro);
      actions.append(retryButton, introButton);

      app.append(card, actions);
      burstConfetti();
      for (let index = 0; index < 8; index += 1) {
        window.setTimeout(spawnFloaty, index * 90);
      }
    }

    function spawnFloaty() {
      const emoji = createElement("span", "floaty", randomItem(floatEmojis));
      emoji.style.left = `${Math.random() * 100}%`;
      emoji.style.setProperty("--size", `${22 + Math.random() * 34}px`);
      emoji.style.setProperty("--speed", `${4 + Math.random() * 3}s`);
      emoji.style.setProperty("--drift", `${-80 + Math.random() * 160}px`);
      emoji.style.setProperty("--spin", `${-180 + Math.random() * 520}deg`);
      reactionLayer.appendChild(emoji);
      window.setTimeout(() => emoji.remove(), 7200);
    }

    function burstConfetti() {
      const colors = ["#ffdf6b", "#41ead4", "#ff6b8a", "#fbfbff", "#fca311"];
      for (let index = 0; index < 28; index += 1) {
        const piece = createElement("span", "confetti");
        piece.style.setProperty("--x", `${30 + Math.random() * 40}%`);
        piece.style.setProperty("--y", `${36 + Math.random() * 22}%`);
        piece.style.setProperty("--dx", `${-180 + Math.random() * 360}px`);
        piece.style.setProperty("--dy", `${-170 + Math.random() * 260}px`);
        piece.style.setProperty("--rot", `${Math.random() * 720}deg`);
        piece.style.setProperty("--color", randomItem(colors));
        reactionLayer.appendChild(piece);
        window.setTimeout(() => piece.remove(), 1000);
      }
    }

    renderIntro();
    floatTimer = window.setInterval(spawnFloaty, 1250);
    window.addEventListener("beforeunload", () => window.clearInterval(floatTimer));
  </script>
</body>
</html>
